<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A Latter-day Saint and temple-theology study companion for Isaiah 1." />
    <title>Isaiah | Bible Explorer</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js?v=1b39d0b"></script>
  </head>
  <body>
    <main class="main-content">
      <header class="compact-header">
        <h1>Isaiah</h1>
        <label for="chapterSelect">Book & chapter
          <select id="chapterSelect" aria-label="Book and chapter">
            <option selected>Isaiah 1 · The covenant lawsuit</option>
            <option disabled>Isaiah 2 · Coming soon</option>
            <option disabled>Isaiah 6 · Coming soon</option>
            <option disabled>Isaiah 11 · Coming soon</option>
            <option disabled>Isaiah 53 · Coming soon</option>
          </select>
        </label>
      </header>

      <section class="table-wrap" id="commentary">
          <div class="table-head" role="row">
            <div>Verse</div><div>KJV English text</div><div>Alternate translation</div><div>Restoration & prophetic witness</div>
          </div>
          <div id="verseList" class="verse-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
